<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <linearGradient id="footerNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#43E97B"/>
    </linearGradient>

    <pattern id="footerGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F2FE" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      fill: #8B949E;
      letter-spacing: 1.5px;
    }
    .neon {
      fill: #00F2FE;
      font-weight: 600;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="76" rx="10" fill="url(#footerBg)" stroke="#1F293D" stroke-width="1.2"/>
  <rect x="2" y="2" width="896" height="76" rx="10" fill="url(#footerGrid)"/>

  <!-- Bottom Accent Neon Bar -->
  <path d="M 14 77 L 886 77" stroke="url(#footerNeon)" stroke-width="2" stroke-linecap="round"/>

  <!-- Footer Text & Status -->
  <g transform="translate(450, 44)" text-anchor="middle" class="mono">
    <text>
      DESIGNED &amp; BUILT BY <tspan class="neon">ARTHUR (AETHERDZ)</tspan> · LOCAL-FIRST &amp; SECURITY BY DEFAULT
    </text>
  </g>

  <!-- High-Tech Corner Accents -->
  <path d="M 10 20 L 10 10 L 20 10" fill="none" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.5"/>
  <path d="M 890 20 L 890 10 L 880 10" fill="none" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.5"/>
</svg>
