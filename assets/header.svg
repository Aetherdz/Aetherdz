<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#43E97B"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F2FE" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="30" cy="0" r="1" fill="#00F2FE" fill-opacity="0.15"/>
    </pattern>

    <!-- Card Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .title {
      font-weight: 800;
      letter-spacing: 4px;
      fill: #FFFFFF;
    }
    .title-accent {
      fill: url(#cyanGradient);
    }
    .subtitle {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #8B949E;
    }
    .prompt {
      font-size: 12px;
      fill: #4FACFE;
      letter-spacing: 1px;
    }
    .status-text {
      font-size: 11px;
      font-weight: 600;
      fill: #38EF7D;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Base Container -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGradient)" stroke="#1F293D" stroke-width="1.5"/>

  <!-- Tech Grid Background -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#techGrid)"/>

  <!-- Top Accent Neon Bar -->
  <path d="M 14 2 L 886 2" stroke="url(#cyanGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Terminal Window Controls -->
  <g transform="translate(24, 22)">
    <circle cx="0" cy="0" r="5" fill="#FF5F56" />
    <circle cx="16" cy="0" r="5" fill="#FFBD2E" />
    <circle cx="32" cy="0" r="5" fill="#27C93F" />
    <text x="48" y="4" class="mono prompt">guest@aetherdz:~$ ./init-core.sh --profile</text>
  </g>

  <!-- Live Status Beacon -->
  <g transform="translate(680, 22)">
    <rect x="-8" y="-9" width="194" height="20" rx="10" fill="#0D1A1E" stroke="#16382C" stroke-width="1"/>
    <circle cx="2" cy="1" r="3.5" fill="#38EF7D">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="5" class="mono status-text">SYSTEM OPERATIONAL</text>
  </g>

  <!-- Main Title & Branding -->
  <g transform="translate(450, 105)" text-anchor="middle">
    <text y="0" class="sans title" font-size="40">
      ARTHUR <tspan class="title-accent">//</tspan> AETHERDZ
    </text>
    <text y="32" class="mono subtitle">
      SYSTEMS &amp; SECURITY ENGINEER · BUG BOUNTY RESEARCHER
    </text>
  </g>

  <!-- Interactive Matrix Info Pods -->
  <g transform="translate(130, 178)" class="mono">
    <!-- Pod 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-12" width="180" height="24" rx="4" fill="#0C1322" stroke="#1F2D44" stroke-width="1"/>
      <text x="90" y="4" text-anchor="middle" font-size="11" fill="#7EE787">⚡ LOCAL-FIRST ARCH</text>
    </g>

    <!-- Pod 2 -->
    <g transform="translate(230, 0)">
      <rect x="0" y="-12" width="180" height="24" rx="4" fill="#0C1322" stroke="#1F2D44" stroke-width="1"/>
      <text x="90" y="4" text-anchor="middle" font-size="11" fill="#00F2FE">🎯 BUG BOUNTY &amp; LOGIC</text>
    </g>

    <!-- Pod 3 -->
    <g transform="translate(460, 0)">
      <rect x="0" y="-12" width="180" height="24" rx="4" fill="#0C1322" stroke="#1F2D44" stroke-width="1"/>
      <text x="90" y="4" text-anchor="middle" font-size="11" fill="#C3E88D">🦀 RUST / PYTHON / KOTLIN</text>
    </g>
  </g>

  <!-- Corner High-Tech Brackets -->
  <path d="M 12 28 L 12 14 L 28 14" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 888 28 L 888 14 L 872 14" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 12 192 L 12 206 L 28 206" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 888 192 L 888 206 L 872 206" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
